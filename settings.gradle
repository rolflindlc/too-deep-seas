pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    resolutionStrategy {
        eachPlugin {
            // MixinGradle no publica el marcador de plugin: se indica el módulo a mano
            if (requested.id.id == 'org.spongepowered.mixin') useModule("org.spongepowered:mixingradle:${requested.version}")
        }
    }
}
plugins {
    // descarga sola el JDK 17 si no lo tienes instalado
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}
rootProject.name = "too-deep-seas"
