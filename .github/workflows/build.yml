name: Compilar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar y pasar las pruebas
        run: ./gradlew build --no-daemon
      - name: Pruebas dentro del juego (servidor de GameTest)
        # Si el servidor no llega a arrancar, Gradle termina bien igualmente: se exige la línea de «todas pasan»
        run: |
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log | grep -vE "/DEBUG\]"
          grep -E "All [0-9]+ required tests passed" gametest.log
      - name: Pruebas dentro del juego con Farmer's Delight instalado
        # Las recetas de olla y de tabla de cortar solo cargan con Farmer's Delight: se repiten las pruebas con él
        run: |
          FD=$(curl -fsSL -G 'https://api.modrinth.com/v2/project/farmers-delight/version' --data-urlencode 'loaders=["forge"]' --data-urlencode 'game_versions=["1.20.1"]' | jq -r '.[0].id + " " + .[0].version_number')
          echo "Farmer's Delight de Modrinth: $FD"
          ./gradlew runGameTestServer -Pfd_version="${FD%% *}" --no-daemon 2>&1 | tee gametest_fd.log | grep -vE "/DEBUG\]"
          grep -F "Farmer's Delight cargado = true" gametest_fd.log
          grep -E "All [0-9]+ required tests passed" gametest_fd.log
      - name: Comprobar el jar (Mixin)
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          unzip -p "$JAR" META-INF/MANIFEST.MF | grep "MixinConfigs: toodeepseas.mixins.json"
          unzip -p "$JAR" toodeepseas.refmap.json
          unzip -p "$JAR" toodeepseas.refmap.json | grep -c "f_" 
      - name: Subir el jar
        uses: actions/upload-artifact@v4
        with:
          name: toodeepseas-jar
          path: build/libs/*.jar
          if-no-files-found: error
